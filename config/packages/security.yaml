security:
    password_hashers:
        'App\Security\AcademicUser': 'auto'

    role_hierarchy:
        ROLE_COORDINACION: ROLE_DOCENTE

    providers:
        academic_users:
            id: App\Security\AcademicUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: academic_users
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }

        # Administración de identidad.
        - { path: ^/configuracion/usuarios, roles: ROLE_GESTION_USUARIOS }

        # Operaciones exclusivamente de coordinación.
        - { path: ^/ofertas/docentes, roles: ROLE_COORDINACION }
        - { path: ^/alumnos/nuevo$, roles: ROLE_COORDINACION }
        - { path: ^/alumnos/\d+/(editar|inscripcion)$, roles: ROLE_COORDINACION }
        - { path: ^/alumnos/\d+/eliminar$, roles: ROLE_COORDINACION }
        - { path: ^/(carreras/nueva|cursos/nuevo|secciones/nueva|pensums/nuevo|ofertas/nueva|anios/nuevo|periodos/nuevo|politicas-academicas/nueva), roles: ROLE_COORDINACION }
        - { path: ^/(carreras|cursos|secciones|pensums|anios|periodos|ofertas|politicas-academicas), roles: ROLE_COORDINACION, methods: [POST] }

        # Evaluación. El Voter limita al docente a sus ofertas asignadas.
        - { path: ^/evaluacion/notas, roles: ROLE_DOCENTE }

        # Lectura académica: docentes navegan el sistema, pero los controladores
        # restringen toda información nominal de estudiantes a sus asignados.
        - { path: ^/reportes, roles: [ROLE_DOCENTE, ROLE_DIRECCION] }
        - { path: ^/alumnos, roles: [ROLE_DOCENTE, ROLE_DIRECCION] }
        - { path: ^/expedientes, roles: [ROLE_DOCENTE, ROLE_DIRECCION] }
        - { path: ^/(carreras|cursos|secciones|pensums|anios|periodos|ofertas|politicas-academicas), roles: [ROLE_COORDINACION, ROLE_DIRECCION], methods: [GET] }

        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }
